name: auction-bot
on:
  schedule:
    - cron: "7 * * * *"     # 예비: 체인이 끊겼을 때 매시 7분에 다시 시작
  workflow_dispatch: {}
concurrency:
  group: auction-bot
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: listen for button + daily alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "auction-bot"
          git config user.email "auction-bot@users.noreply.github.com"
          python alert.py --listen 3240
      - name: save state
        if: always()
        run: |
          git config user.name "auction-bot"
          git config user.email "auction-bot@users.noreply.github.com"
          git add seen.json state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "state $(date -u +%FT%TZ)" && git pull --rebase && git push)
      - name: start next listener
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref main
