name: auction-bot
on:
  schedule:
    - cron: "0 * * * *"     # 매시 정각에 리스너 재시작 (실제 시작은 몇 분 늦을 수 있음)
  workflow_dispatch: {}
concurrency:
  group: auction-bot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: listen for button + daily alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alert.py --listen 3240
      - name: save state
        if: always()
        run: |
          git config user.name "auction-bot"
          git config user.email "auction-bot@users.noreply.github.com"
          git add seen.json state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "state $(date -u +%FT%TZ)" && git push)
